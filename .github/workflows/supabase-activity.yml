name: Supabase activity check

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-activity:
    name: Read-only database activity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Query tenants table
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL repository secret" >&2; exit 1; }
          test -n "$SUPABASE_KEY" || { echo "Missing SUPABASE_ANON_KEY repository secret" >&2; exit 1; }

          response=$(curl --fail-with-body --silent --show-error --retry 3 \
            --connect-timeout 10 --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Accept: application/json" \
            "${SUPABASE_URL%/}/rest/v1/tenants?select=id&limit=1")
          rows=$(jq 'length' <<<"$response")
          echo "Supabase read-only activity check succeeded (rows returned: $rows)."
